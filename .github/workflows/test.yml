name: tests

# Every PR, plus every push to main, on both platforms the skill claims to support.
# Pushes to a PR branch do not need a second run - `pull_request` already covers them.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false # a Windows-only failure must not hide the Linux result
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the skill suites are stdlib-only by convention, and they
      # run throwaway localhost servers instead of reaching the network.
      # Discovers every skills/*/tests/ directory and runs each suite; skills
      # without tests/ are skipped, not failed.
      - name: Run skill test suites
        run: python tools/run_skill_tests.py
      # Self-test for the discovery logic above (fake skills tree in tmp).
      - name: Self-test the test runner
        run: python tools/test_run_skill_tests.py
      # Proves the skill installer resolves the Hermes root and plans every copy on this OS,
      # without touching a real install: --dry-run changes nothing, and it does not create
      # ~/.hermes or %LOCALAPPDATA%\hermes. Fails if any skill lacks a category.
      - name: Dry-run the skill installer
        run: python tools/install_skills.py --dry-run
      # Self-test for the installer: root resolution order, category mapping, dry-run, overwrite,
      # missing-category failure. Every case runs in a temp dir, never a real Hermes install.
      - name: Self-test the skill installer
        run: python tools/test_install_skills.py

  lint:
    name: lint / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false # a Windows-only failure must not hide the Linux result
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Conformance gate for skills/: frontmatter (required keys, name == directory,
      # X.Y.Z version, allowed platforms), .py compilation, embedded-secret scan, and each
      # skill's own tests/ suite. Stdlib-only, so there is nothing to install first.
      - name: Lint skills
        run: python tools/lint_skills.py
      # The linter's self-test: tools/fixtures/broken-skill/ must be rejected with the right
      # rules named, and this repo's own skills must pass.
      - name: Self-test the linter
        run: python tools/test_lint_skills.py
