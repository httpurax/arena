name: certus-quartz-ore

on:
  push:
    tags:
      - 'certusore-v*'
    paths:
      - 'minecraft-mods/certus-quartz-ore/**'
      - '.github/workflows/certus-quartz-ore.yml'
  pull_request:
    paths:
      - 'minecraft-mods/certus-quartz-ore/**'
      - '.github/workflows/certus-quartz-ore.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: minecraft-mods/certus-quartz-ore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: certusore-jar
          path: minecraft-mods/certus-quartz-ore/build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/certusore-v')
        uses: softprops/action-gh-release@v2
        with:
          files: minecraft-mods/certus-quartz-ore/build/libs/*.jar
          generate_release_notes: true
