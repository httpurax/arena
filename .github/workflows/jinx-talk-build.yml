name: Jinx Talk build

on:
  push:
    paths:
      - 'jinx-talk/**'
      - '.github/workflows/jinx-talk-build.yml'
  pull_request:
    paths:
      - 'jinx-talk/**'
      - '.github/workflows/jinx-talk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jinx-talk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jinxtalk-1.0.0
          path: jinx-talk/build/libs/jinxtalk-1.0.0.jar
          if-no-files-found: error
