name: Jinx Talk build

on:
  push:
    paths:
      - 'jinx-talk/**'
      - '.github/workflows/jinx-talk-build.yml'
  pull_request:
    paths:
      - 'jinx-talk/**'
      - '.github/workflows/jinx-talk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jinx-talk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew build > build-output.log 2>&1
          status=$?
          cat build-output.log
          if [ "$status" -ne 0 ]; then
            # Keep the failure visible in the check annotations as well as the log.
            python3 - <<'PY'
          from pathlib import Path
          tail = '\n'.join(Path('build-output.log').read_text(errors='replace').splitlines()[-100:])
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Gradle build failed::{escaped}')
          PY
          fi
          exit "$status"
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jinxtalk-1.0.0
          path: jinx-talk/build/libs/jinxtalk-1.0.0.jar
          if-no-files-found: error
