[[mods]]
modId="jinxtalk"
version="1.0.0"
displayName="Jinx Talk"
description='''
Jinx Talk sends Minecraft chat messages and (when FTB Quests is installed) quest
completions to an external HTTP event service, and can announce responses back in-game.

The event service URL is configurable in config/jinxtalk.toml (default
http://127.0.0.1:8712). Events are POSTed as JSON to <base>/event; if the service
responds with a JSON object containing an "announce" string, the naming player is
shown that text in gold chat and hears minecraft:entity.player.levelup.

FTB Quests (mod id ftbquests) is an optional dependency: jinx-talk loads and works
with or without it installed.
'''

[[dependencies.jinxtalk]]
modId="neoforge"
mandatory=true
versionRange="[21,)"
ordering="NONE"
side="BOTH"

[[dependencies.jinxtalk]]
modId="minecraft"
mandatory=true
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.jinxtalk]]
modId="ftbquests"
mandatory=false
versionRange="[2101.1.6,)"
ordering="AFTER"
side="BOTH"
