// NeoForge 1.21.1 build for the jinx-talk mod (mod id: jinxtalk).
//
// Uses the official NeoGradle userdev plugin (MDK-1.21.1-NeoGradle template).
// Building requires network access to Maven (maven.neoforged.net, maven.saps.dev
// for FTB Quests, mavenCentral), which the sandbox does not provide; the Java
// sources are written against the verified NeoForge 1.21.1 and FTB Quests
// 2101.1.6 APIs instead.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // FTB Quests (dev.ftb.mods) publishes here.
    maven {
        name = 'saps'
        url = 'https://maven.saps.dev/releases'
    }
}

dependencies {
    // NeoForge 1.21.1
    implementation "net.neoforged:neoforge:${neo_version}"

    // FTB Quests is a SOFT dependency: compileOnly so it is never bundled into
    // our jar, and mandatory=false ordering=AFTER in neoforge.mods.toml so the
    // mod loads and works whether or not FTB Quests is installed.
    compileOnly "dev.ftb.mods:ftbquests:${ftbquests_version ?: '2101.1.6'}"
}

// This block of code expands all declared replace properties in the specified
// resource targets (e.g. META-INF/neoforge.mods.toml). A missing property will
// result in an error. Properties are expanded using ${} Groovy notation.
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
