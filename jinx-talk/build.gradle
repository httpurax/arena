plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.jinxtalk'
version = mod_version

base {
    archivesName = 'jinxtalk'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        jinxtalk {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    // ModDevGradle's main Minecraft libraries are not inherited by the plain test source set.
    // Match Minecraft 1.21.1's Gson; this is test-only, never bundled into the mod jar.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// No test framework needed: this executable suite uses the JDK's local HTTP server.
tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.jinxtalk.ChatCoreTest'
    enableAssertions = true
}

// The suite has a main method, not JUnit methods; coreTest replaces framework discovery.
tasks.named('test') {
    enabled = false
}

tasks.named('check') {
    dependsOn coreTest
}
