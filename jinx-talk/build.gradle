// NeoForge 1.21.1 build for the jinx-talk mod (mod id: jinxtalk).
//
// This is a declarative NeoForge MDK-style build script. The NeoForge Gradle
// wrapper is not part of this repository: generate it with `gradle wrapper`
// (or copy it from a NeoForge MDK) before building. Building also requires
// network access to Maven (maven.neoforged.com, maven.saps.dev for FTB Quests,
// mavenCentral), which is intentionally unavailable in this sandbox; the Java
// sources below are written against the verified NeoForge 1.21.1 and FTB
// Quests 2101.1.6 APIs instead.

plugins {
    id 'maven-publish'
    id 'net.neoforge.gradle' version '6.0.24' apply false
}

version = rootProject.properties['mod_version'] ?: '1.0.0'
group = rootProject.properties['maven_group'] ?: 'com.github.httpurax'

repositories {
    maven {
        name = 'neoforge'
        url = 'https://maven.neoforged.com/releases'
    }
    maven {
        name = 'neoforge-snapshots'
        url = 'https://maven.neoforged.com/snapshots'
    }
    // FTB Quests (dev.ftb.mods) publishes here.
    maven {
        name = 'saps'
        url = 'https://maven.saps.dev/releases'
    }
    mavenCentral()
}

dependencies {
    // NeoForge 1.21.1
    minecraft "net.neoforged:neoforge:${rootProject.properties['minecraft_version']}-${rootProject.properties['neoforge_version']}:universal"

    // FTB Quests is a SOFT dependency: compileOnly so it is never bundled into
    // our jar, and mandatory=false ordering=AFTER in neoforge.mods.toml so the
    // mod loads and works whether or not FTB Quests is installed.
    compileOnly "dev.ftb.mods:ftbquests:${rootProject.properties['ftbquests_version'] ?: '2101.1.6'}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.WARN
    filtering = true
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'jinx-talk',
                'Specification-Version': version,
                'Implementation-Title': project.name,
                'Implementation-Version': version,
                'Implementation-Vendor': group,
                'Implementation-Timestamp': new Date().iso8601Basic
        ])
    }
}
