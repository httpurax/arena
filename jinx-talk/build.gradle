plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.jinxtalk'
version = mod_version

base {
    archivesName = 'jinxtalk'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        jinxtalk {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    // FTB Quests and its FTB Library / FTB Teams companions publish here.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    maven {
        name = 'FTB (saps mirror)'
        url = 'https://maven.saps.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    // FTB Quests' quest-completion events are Architectury events.
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
}

dependencies {
    // FTB Quests is a SOFT dependency: compileOnly so none of it is bundled
    // into our jar, and type="optional" in neoforge.mods.toml so the mod loads
    // and works whether or not FTB Quests is installed. The FTB Quests classes
    // are only referenced from dev.jinxtalk.ftbquests.*, which is only loaded
    // after ModList confirms the ftbquests mod is present.
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftbquests_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    // ModDevGradle's main Minecraft libraries are not inherited by the plain test source set.
    // Match Minecraft 1.21.1's Gson; this is test-only, never bundled into the mod jar.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// No test framework needed: this executable suite uses the JDK's local HTTP server.
tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.jinxtalk.ChatCoreTest'
    enableAssertions = true
}

// The suite has a main method, not JUnit methods; coreTest replaces framework discovery.
tasks.named('test') {
    enabled = false
}

tasks.named('check') {
    dependsOn coreTest
}
